      - name: Publish v0.9.6 to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.6'
          FILE='Gen5W-Climate-Mini-v0.9.6-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.9.6 — compact icon-and-label climate controls without ON/OFF labels.
          - DRIVER ONLY / A/C / SYNC active icons blue, HEAT active icon orange; inactive gray. No ON/OFF text; 454x64 size.
          - Retains confirmed ON/OFF status, immediate tap preview, touch handling and climate commands.
          - Retains NAV screen diagnostics; NAV search/route hiding is NOT fixed.
          - Retains in-app diagnostic log, map positioning and safe overlay behavior.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.9.6' --notes-file /tmp/notes.md
          fi
