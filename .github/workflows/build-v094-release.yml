      - name: Validate passive NAV logging and app menu
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/gen5w/climatemini')
          overlay=(p/'OverlayService.java').read_text()
          observer=(p/'NaviMapStateMonitor.java').read_text()
          diagnostics=(p/'NavDiagnostics.java').read_text()
          broadcasts=(p/'NavActionObserver.java').read_text()
          ui=(p/'MainActivity.java').read_text()
          viewer=(p/'DiagnosticActivity.java').read_text()
          gradle=Path('app/build.gradle').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'getNaviDrawViewState' in observer and 'GET_DRAW_VIEW = 13' in observer
          assert 'GET_MAP_VIEW = 5' in observer
          assert 'NavDiagnostics.record' in overlay
          assert '!Boolean.FALSE.equals(stockMap)' in overlay
          assert 'private static final int HEAT_ON = 0xffab5918;' in overlay
          assert 'NAV_EVENT ' in broadcasts and 'NavDiagnostics.record' in broadcasts
          assert 'getString("lines"' in diagnostics and 'MAX_LINES = 120' in diagnostics
          assert 'static synchronized void clear(' in diagnostics
          assert 'off.setText("공조 미니바 끄기")' in ui
          assert 'logs.setText("진단 로그")' in ui
          assert ui.index('off.setText(') < ui.index('logs.setText(') < ui.index('status =')
          assert 'new Intent(this, DiagnosticActivity.class)' in ui
          assert 'NavDiagnostics.report(this)' in viewer
          assert 'ClipData.newPlainText(' in viewer
          assert 'NavDiagnostics.clear(this)' in viewer
          assert '<activity android:name=".DiagnosticActivity" android:exported="false"' in manifest
          assert 'versionCode 14' in gradle and '0.9.4-v039-nav-action-diagnostics' in gradle
          print('v0.9.4 logging viewer and passive OEM diagnostics validated; climate controls unchanged')
          PYCODE
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Create and verify NEMESIS USB installer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import io,zipfile,hashlib,configparser
          apkfile=Path('app/build/outputs/apk/debug/app-debug.apk')
          apk=apkfile.read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(apkfile): raise RuntimeError('APK not built')
          short='NAV screen diagnostics with in-app log viewer'
          assert len(short) <= 64
          details='Records numeric MAP/DRAW state and NAV events; in-app log button. Climate controls unchanged.'
          assert len(details)<=256
          desc = ('[nemesis]\n'
              'version=1.1\n'
              'id=gen5w.climate.mini\n'
              'name=Gen5W Climate Mini\n'
              'type=application\n'
              'package-version=0.9.4\n'
              'short-desc=NAV screen diagnostics with in-app log viewer\n'
              'detailed-desc=Records numeric MAP/DRAW state and NAV events; in-app log button. Climate controls unchanged.\n'
              'os=any\nmodels=any\n\n'
              '[app.0]\n'
              'kind=apk\n'
              'path=app/Gen5W-Climate-Mini-v0.9.4.apk\n'
              'package=io.github.gen5w.climatemini\n'
              'component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n')
          rootdesc='[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          # Validate both descriptors before releasing; avoid the v0.8 literal \n bug.
          cp=configparser.ConfigParser(interpolation=None)
          cp.read_string(desc)
          assert cp.get('nemesis','package-version')=='0.9.4'
          cp2=configparser.ConfigParser(interpolation=None)
          cp2.read_string(rootdesc)
          assert cp2.get('nemesis','type')=='install'
          inner=io.BytesIO()
          with zipfile.ZipFile(inner,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',desc)
              z.writestr('app/Gen5W-Climate-Mini-v0.9.4.apk',apk)
          target=Path('Gen5W-Climate-Mini-v0.9.4-NEMESIS-USB.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',rootdesc)
              z.writestr('packages/gen5w.climate.mini.zip',inner.getvalue())
              z.writestr('README-USB.txt','Unzip once. Copy NEMESIS.data + packages/ to USB root.\n'
                  'v0.9.4 records MAP/DRAW numeric signals and NAV events. Open Climate Mini > diagnostic log to copy.\n'
                  'Please test MAP and NAV screen switching while parked.\n')
          with zipfile.ZipFile(target) as z:
              c=configparser.ConfigParser(interpolation=None)
              c.read_string(z.read('NEMESIS.data').decode())
              assert c.get('nemesis','path') == 'packages/gen5w.climate.mini.zip'
              with zipfile.ZipFile(io.BytesIO(z.read(c.get('nemesis','path')))) as pkg:
                  c=configparser.ConfigParser(interpolation=None)
                  c.read_string(pkg.read('NEMESIS.data').decode())
                  assert c.get('nemesis','id') == 'gen5w.climate.mini'
                  assert c.get('app.0','path') in pkg.namelist()
                  assert pkg.read(c.get('app.0','path'))==apk
          print('Valid NEMESIS ZIP:',target,'APK SHA256',hashlib.sha256(apk).hexdigest())
          PYCODE
      - name: Upload v0.9 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.9.4-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.9.4-NEMESIS-USB.zip
      - name: Publish v0.9 to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.4'
          FILE='Gen5W-Climate-Mini-v0.9.4-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.9.4 — NAV event diagnostics and in-app log viewer; no accessibility setup needed.
          - Retains v0.9.2 visibility and all four climate controls, HEAT orange color and touch behavior.
          - Retains read-only getNaviMapViewState and getNaviDrawViewState monitoring.
          - Climate Mini app offers a diagnostic log button below Stop with scrollable, copyable event history.
          - This is diagnostic only: NAV menu hiding is not yet fixed.
          - No destinations, search text, coordinates, or screenshots are collected. Keeps at most 120 local log lines.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.9.4' --notes-file /tmp/notes.md
          fi
