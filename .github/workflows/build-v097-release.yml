                      raise RuntimeError('Unsafe source entry '+str(path))
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(item))
          print('Extracted v0.9.7 app sources with in-app diagnostic log viewer')
          PYCODE
