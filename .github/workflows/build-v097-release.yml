      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Create and verify NEMESIS USB installer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import io,zipfile,hashlib,configparser
          apkfile=Path('app/build/outputs/apk/debug/app-debug.apk')
          apk=apkfile.read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(apkfile): raise RuntimeError('APK not built')
          short='Compact climate icons with NAV search auto-hide'
          assert len(short) <= 64
          details='Compact four-icon bar (454x64). NAV search/route draw=2 hides overlay, map draw=1 shows it. Status and logs preserved.'
          assert len(details)<=256
          desc = ('[nemesis]\n'
              'version=1.1\n'
              'id=gen5w.climate.mini\n'
              'name=Gen5W Climate Mini\n'
              'type=application\n'
              'package-version=0.9.7\n'
              'short-desc=Compact climate icons with NAV search auto-hide\n'
              'detailed-desc=Compact four-icon bar (454x64). NAV search/route draw=2 hides overlay, map draw=1 shows it. Status and logs preserved.\n'
              'os=any\nmodels=any\n\n'
              '[app.0]\n'
              'kind=apk\n'
              'path=app/Gen5W-Climate-Mini-v0.9.7.apk\n'
              'package=io.github.gen5w.climatemini\n'
              'component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n')
          rootdesc='[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          # Validate both descriptors before releasing; avoid the v0.8 literal \n bug.
          cp=configparser.ConfigParser(interpolation=None)
          cp.read_string(desc)
          assert cp.get('nemesis','package-version')=='0.9.7'
          cp2=configparser.ConfigParser(interpolation=None)
          cp2.read_string(rootdesc)
          assert cp2.get('nemesis','type')=='install'
          inner=io.BytesIO()
          with zipfile.ZipFile(inner,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',desc)
              z.writestr('app/Gen5W-Climate-Mini-v0.9.7.apk',apk)
          target=Path('Gen5W-Climate-Mini-v0.9.7-NEMESIS-USB.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',rootdesc)
              z.writestr('packages/gen5w.climate.mini.zip',inner.getvalue())
              z.writestr('README-USB.txt','Unzip once. Copy NEMESIS.data + packages/ to USB root.\n'
                  'v0.9.7 NAV draw=2 search/route hiding; draw=1 map. Compact icons remain.\n'
                  'Please test MAP and NAV screen switching while parked.\n')
          with zipfile.ZipFile(target) as z:
              c=configparser.ConfigParser(interpolation=None)
              c.read_string(z.read('NEMESIS.data').decode())
              assert c.get('nemesis','path') == 'packages/gen5w.climate.mini.zip'
              with zipfile.ZipFile(io.BytesIO(z.read(c.get('nemesis','path')))) as pkg:
                  c=configparser.ConfigParser(interpolation=None)
                  c.read_string(pkg.read('NEMESIS.data').decode())
                  assert c.get('nemesis','id') == 'gen5w.climate.mini'
                  assert c.get('app.0','path') in pkg.namelist()
                  assert pkg.read(c.get('app.0','path'))==apk
          print('Valid NEMESIS ZIP:',target,'APK SHA256',hashlib.sha256(apk).hexdigest())
          PYCODE
      - name: Upload v0.9.7 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.9.7-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.9.7-NEMESIS-USB.zip
      - name: Publish v0.9.7 to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.7'
          FILE='Gen5W-Climate-Mini-v0.9.7-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.9.7 — NAV search/route auto-hide using observed V039 draw state.
          - DRIVER ONLY / A/C / SYNC active icons blue, HEAT active icon orange; inactive gray. No ON/OFF text; 454x64 size.
          - Retains confirmed ON/OFF status, immediate tap preview, touch handling and climate commands.
          - When NAV draw=2 stays stable, hide popup; draw=1 restores on map. Tested screen states from V039 logs; real car behavior needs validation.
          - Retains in-app diagnostic log, map positioning and safe overlay behavior.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.9.7' --notes-file /tmp/notes.md
          fi
