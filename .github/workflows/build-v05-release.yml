      - name: Make NEMESIS USB install archive
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile, hashlib
          apk = Path('app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(Path('app/build/outputs/apk/debug/app-debug.apk')):
              raise RuntimeError('APK did not build correctly')
          descriptor = ("[nemesis]\n"
              "version=1.1\n"
              "id=gen5w.climate.mini\n"
              "name=Gen5W Climate Mini\n"
              "type=application\n"
              "package-version=0.5.0\n"
              "short-desc=Map-only Activity filter, one-tap HEAT, reboot restore\n"
              "detailed-desc=Vehicle DATC; HEAT fallback is last REQUESTED state, not live state. MAP-only by foreground Activity only.\n"
              "os=any\nmodels=any\n\n"
              "[app.0]\n"
              "kind=apk\n"
              "path=app/Gen5W-Climate-Mini-v0.5.apk\n"
              "package=io.github.gen5w.climatemini\n"
              "component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n")
          package = Path('gen5w.climate.mini.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data', descriptor)
              z.writestr('app/Gen5W-Climate-Mini-v0.5.apk', apk)
          install_config = '[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          with zipfile.ZipFile('Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data', install_config)
              z.write(package, 'packages/gen5w.climate.mini.zip')
              z.writestr('README-USB.txt','Extract the archive to the USB root so NEMESIS.data and packages/ are at root.\n'
                  'Test HEAT and map-only auto-hide parked. MAP subpages sharing an Activity may remain visible.\n')
          print('APK SHA256:', hashlib.sha256(apk).hexdigest())
          print('NEMESIS installer ZIP bytes:', Path('Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip').stat().st_size)
          PYCODE
      - name: Upload NEMESIS USB installer
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.5-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip
          if-no-files-found: error
      - name: Upload debug APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.5-APK-for-debugging-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify final NEMESIS USB package
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          p = Path('Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip')
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert 'NEMESIS.data' in names and 'packages/gen5w.climate.mini.zip' in names, names
              with zipfile.ZipFile(__import__('io').BytesIO(z.read('packages/gen5w.climate.mini.zip'))) as inner:
                  assert 'NEMESIS.data' in inner.namelist()
                  assert 'app/Gen5W-Climate-Mini-v0.5.apk' in inner.namelist()
          print('Verified: USB installer contains nested NEMESIS descriptor and v0.5 APK')
          PYCODE
      - name: Publish direct-download GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v0.5.0'
          FILE='Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip'
          cat > /tmp/release-notes.md <<'NOTES'
          Gen5W Climate Mini v0.5 — NEMESIS USB installation package.

          - Compact persistent bar, last saved coordinates restored on boot, no checkboxes or clipped warnings.
          - HEAT one-tap: fallback `~ON` / `~OFF` means last REQUEST sent, not verified physical status.
          - Foreground Activity MAP filter auto-learns when MAP is opened from app settings.
          - LIMIT: MAP search/settings screens sharing the SAME Android Activity cannot be distinguished by this method.
          - Test the new HEAT behavior and screen changes parked before depending on it.

          INSTALL:
          Download **Gen5W-Climate-Mini-v0.5-NEMESIS-USB.zip** from the Assets list.
          Extract this zip once, then copy its NEMESIS.data and packages/ folder to the root of a USB drive.
          Uninstall only the prior Gen5W Climate Mini package before reinstalling if required.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Gen5W Climate Mini v0.5' \
              --notes-file /tmp/release-notes.md
          fi
          echo 'Direct installer: https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/'"$FILE"
