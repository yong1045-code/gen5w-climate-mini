      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Produce NEMESIS USB ZIP
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile, io, hashlib
          apkfile = Path('app/build/outputs/apk/debug/app-debug.apk')
          apk = apkfile.read_bytes()
          if not zipfile.is_zipfile(apkfile) or len(apk) < 1000:
              raise RuntimeError('APK output missing')
          short = 'Real HEAT feedback; navigation menu auto-hide observer'
          assert len(short) <= 64
          descriptor = ('[nemesis]\n'
              'version=1.1\n'
              'id=gen5w.climate.mini\n'
              'name=Gen5W Climate Mini\n'
              'type=application\n'
              'package-version=0.7.0\n'
              'short-desc=' + short + '\n'
              'detailed-desc=Four OEM DATC controls; read-only HeatOnOff listener. NAV search hide requires Accessibility access.\n'
              'os=any\nmodels=any\n\n'
              '[app.0]\n'
              'kind=apk\n'
              'path=app/Gen5W-Climate-Mini-v0.7.apk\n'
              'package=io.github.gen5w.climatemini\n'
              'component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n')
          package = io.BytesIO()
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',descriptor)
              z.writestr('app/Gen5W-Climate-Mini-v0.7.apk',apk)
          install = '[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          dist = Path('Gen5W-Climate-Mini-v0.7-NEMESIS-USB.zip')
          with zipfile.ZipFile(dist,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',install)
              z.writestr('packages/gen5w.climate.mini.zip',package.getvalue())
              z.writestr('README-USB.txt','Extract the ZIP once and copy NEMESIS.data and packages/ to USB root.\n'
                 'HEAT actual state requires readback; fallback is ?.\n'
                 'The navigation search detector is an optional Android Accessibility service. Enable manually and test parked.\n')
          with zipfile.ZipFile(dist) as z:
              assert 'NEMESIS.data' in z.namelist()
              with zipfile.ZipFile(io.BytesIO(z.read('packages/gen5w.climate.mini.zip'))) as inner:
                  assert 'NEMESIS.data' in inner.namelist()
                  assert 'app/Gen5W-Climate-Mini-v0.7.apk' in inner.namelist()
                  ini=inner.read('NEMESIS.data').decode()
                  assert 'package-version=0.7.0' in ini
          print('Verified installer ZIP:', dist, 'APK sha256', hashlib.sha256(apk).hexdigest())
          PYCODE
      - name: Upload NEMESIS installation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.7-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.7-NEMESIS-USB.zip
      - name: Publish ZIP directly to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.7.0'
          FILE='Gen5W-Climate-Mini-v0.7-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.7 — NEMESIS USB installer.
          - HEAT now uses actual OEM DATC status callback `DatcStatus.getHeatOnOff()` and never guesses ON/OFF from last command. If readback isn't available, HEAT remains `?` and no blind toggle is sent.
          - Climate Mini screen shows the widget; the stock map shows it.
          - Optional search-page detection uses Android Accessibility for `com.mnsoft.navi` only; enable manually. Some OEM menu views are invisible to accessibility and may need further research.
          - Existing DRIVER/A/C/SYNC, touch sound, saved coordinates, dark compact bar kept.
          - Vehicle validation required. Keep the previous working installer until checked.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.7' --notes-file /tmp/notes.md
          fi
