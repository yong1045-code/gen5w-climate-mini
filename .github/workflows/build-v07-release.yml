          b = base64.b64decode(''.join(payload.split()))
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              for entry in z.infolist():
                  p = Path(entry.filename)
                  if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] != 'app':
