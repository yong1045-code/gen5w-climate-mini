          assert 'MENU_ACTIVITY = "com.mnsoft.navi.NaviApp"' in s
          assert 'MAP_ACTIVITY.equals(top.getClassName())' in s
          assert 'MENU_ACTIVITY.equals(top.getClassName())' not in s.split('boolean isMap(')[1].split('boolean isNavMenu(')[0]
          o=Path('app/src/main/java/io/github/gen5w/climatemini/OverlayService.java').read_text()
          assert 'detector.isMap(foreground)' in o
          assert 'isOwnApp' in o
          assert 'NavSearchAccessibilityService.searchVisible()' in o
          b=Path('app/build.gradle').read_text()
          assert 'versionCode 11' in b
          assert 'versionName \'0.9.1-heat-orange\'' in b
          assert 'private static final int HEAT_ON = 0xffab5918;' in o
          assert 'boolean heatOn = i == 2 && shown == 1;' in o
          assert 'int fill = heatOn ? HEAT_ON' in o
          print('Validated v0.9.1 MAP/NAV gate and orange-on-HEAT visuals')
          PYCODE
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Create and verify NEMESIS USB installer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import io,zipfile,hashlib,configparser
          apkfile=Path('app/build/outputs/apk/debug/app-debug.apk')
          apk=apkfile.read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(apkfile): raise RuntimeError('APK not built')
          short='HEAT ON orange accent; other buttons unchanged'
          assert len(short) <= 64
          details='HEAT shows orange only while ON. Vehicle control, MAP screen rules, drag and saved position remain unchanged.'
          assert len(details)<=256
          desc = ('[nemesis]\n'
              'version=1.1\n'
              'id=gen5w.climate.mini\n'
              'name=Gen5W Climate Mini\n'
              'type=application\n'
              'package-version=0.9.1\n'
              'short-desc=HEAT ON orange accent; other buttons unchanged\n'
              'detailed-desc=HEAT shows orange only while ON. Vehicle control, MAP screen rules, drag and saved position remain unchanged.\n'
              'os=any\nmodels=any\n\n'
              '[app.0]\n'
              'kind=apk\n'
              'path=app/Gen5W-Climate-Mini-v0.9.apk\n'
              'package=io.github.gen5w.climatemini\n'
              'component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n')
          rootdesc='[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          # Validate both descriptors before releasing; avoid the v0.8 literal \n bug.
          cp=configparser.ConfigParser(interpolation=None)
          cp.read_string(desc)
          assert cp.get('nemesis','package-version')=='0.9.1'
          cp2=configparser.ConfigParser(interpolation=None)
          cp2.read_string(rootdesc)
          assert cp2.get('nemesis','type')=='install'
          inner=io.BytesIO()
          with zipfile.ZipFile(inner,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',desc)
              z.writestr('app/Gen5W-Climate-Mini-v0.9.apk',apk)
          target=Path('Gen5W-Climate-Mini-v0.9.1-NEMESIS-USB.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',rootdesc)
              z.writestr('packages/gen5w.climate.mini.zip',inner.getvalue())
              z.writestr('README-USB.txt','Unzip once. Copy NEMESIS.data + packages/ to USB root.\n'
                  'v0.9.1 orange HEAT when ON. MapApp only, excludes NAV menu NaviApp.\n'
                  'Please test MAP and NAV screen switching while parked.\n')
          with zipfile.ZipFile(target) as z:
              c=configparser.ConfigParser(interpolation=None)
              c.read_string(z.read('NEMESIS.data').decode())
              assert c.get('nemesis','path') == 'packages/gen5w.climate.mini.zip'
              with zipfile.ZipFile(io.BytesIO(z.read(c.get('nemesis','path')))) as pkg:
                  c=configparser.ConfigParser(interpolation=None)
                  c.read_string(pkg.read('NEMESIS.data').decode())
                  assert c.get('nemesis','id') == 'gen5w.climate.mini'
                  assert c.get('app.0','path') in pkg.namelist()
                  assert pkg.read(c.get('app.0','path'))==apk
          print('Valid NEMESIS ZIP:',target,'APK SHA256',hashlib.sha256(apk).hexdigest())
          PYCODE
      - name: Upload v0.9 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.9.1-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.9.1-NEMESIS-USB.zip
      - name: Publish v0.9 to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.1'
          FILE='Gen5W-Climate-Mini-v0.9.1-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.9.1 — MAP / NAV screen gate correction.

          - HEAT ON now uses the stock-climate-inspired orange colour; HEAT OFF remains grey.
          - Display rule unchanged: MAP and Climate Mini only; NAV search excluded.
          - Vehicle control, readback, touch feedback, position and reboot restore unchanged from v0.9.
          - Orange preview appears immediately, only actual vehicle state confirms it.
          - Code not yet tested on a Korean V039 head unit after this change.
          - USB: extract ZIP once; place NEMESIS.data and packages/ on USB root.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.9.1' --notes-file /tmp/notes.md
          fi
