      - name: Compile APK
        shell: bash
        run: gradle --no-daemon assembleDebug
      - name: Create NEMESIS USB zip (use this for the car)
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile,hashlib
          apk=Path('app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          assert len(apk)>1000
          package="""[nemesis]
          version=1.1
          id=gen5w.climate.mini
          name=Gen5W Climate Mini
          type=application
          package-version=0.3.0
          short-desc=Compact floating climate bar with readback
          detailed-desc=Uses OEM DATC. Korean V039 control is not on-car validated. HEAT disabled unless status readable.
          os=any
          models=any

          [app.0]
          kind=apk
          path=app/Gen5W-Climate-Mini-v0.3.apk
          package=io.github.gen5w.climatemini
          component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity
          """
          package='\n'.join(line.lstrip() for line in package.splitlines())+'\n'
          pkg=Path('gen5w.climate.mini.zip')
          with zipfile.ZipFile(pkg,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',package)
              z.writestr('app/Gen5W-Climate-Mini-v0.3.apk',apk)
          cfg='[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          with zipfile.ZipFile('Gen5W-Climate-Mini-v0.3-NEMESIS-USB.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',cfg)
              z.write(pkg,'packages/gen5w.climate.mini.zip')
              z.writestr('README-USB.txt','Extract this ZIP at USB root (NEMESIS.data and packages/). Install/update via NEMESIS while parked.\n' +
              'v0.3 reads OEM DATC and requires opt-in for writes. Korean V039 vehicle control unverified. HEAT disabled when state unknown.\n')
          print('APK sha256:',hashlib.sha256(apk).hexdigest())
          print('USB zip generated:',Path('Gen5W-Climate-Mini-v0.3-NEMESIS-USB.zip').stat().st_size)
          PYCODE
      - name: Upload NEMESIS USB installer
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.3-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.3-NEMESIS-USB.zip
          if-no-files-found: error
      - name: Upload standalone APK for debugging
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.3-APK-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
