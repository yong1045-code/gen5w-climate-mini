      - name: Validate V039 map recovery and NAV observer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/gen5w/climatemini/')
          detector=(p/'MapScreenDetector.java').read_text()
          overlay=(p/'OverlayService.java').read_text()
          observer=(p/'NaviMapStateMonitor.java').read_text()
          gradle=Path('app/build.gradle').read_text()
          assert '|| MENU_ACTIVITY.equals(top.getClassName())' in detector
          assert 'new NaviMapStateMonitor()' in overlay
          assert 'mapViewObserver.mapVisible()' in overlay
          assert '!Boolean.FALSE.equals(stockMap)' in overlay
          assert 'NavSearchAccessibilityService.searchVisible()' in overlay
          assert 'GET_MAP_VIEW = 5' in observer
          assert 'com.mnsoft.navi.InterfaceService' in observer
          assert 'versionCode 12' in gradle
          assert 'versionName \'0.9.2-v039-map-restore\'' in gradle
          assert 'private static final int HEAT_ON = 0xffab5918;' in overlay
          print('Validated v0.9.2 V039 foreground NaviApp support and read-only OEM map state observer')
          PYCODE
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Create and verify NEMESIS USB installer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import io,zipfile,hashlib,configparser
          apkfile=Path('app/build/outputs/apk/debug/app-debug.apk')
          apk=apkfile.read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(apkfile): raise RuntimeError('APK not built')
          short='V039 MAP screen recovery; HEAT orange ON'
          assert len(short) <= 64
          details='V039 NaviApp may be a map. Uses stock nav map view state to hide menu when available. Climate controls unchanged.'
          assert len(details)<=256
          desc = ('[nemesis]\n'
              'version=1.1\n'
              'id=gen5w.climate.mini\n'
              'name=Gen5W Climate Mini\n'
              'type=application\n'
              'package-version=0.9.2\n'
              'short-desc=V039 MAP screen recovery; HEAT orange ON\n'
              'detailed-desc=V039 NaviApp may be a map. Uses stock nav map view state to hide menu when available. Climate controls unchanged.\n'
              'os=any\nmodels=any\n\n'
              '[app.0]\n'
              'kind=apk\n'
              'path=app/Gen5W-Climate-Mini-v0.9.apk\n'
              'package=io.github.gen5w.climatemini\n'
              'component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n')
          rootdesc='[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          # Validate both descriptors before releasing; avoid the v0.8 literal \n bug.
          cp=configparser.ConfigParser(interpolation=None)
          cp.read_string(desc)
          assert cp.get('nemesis','package-version')=='0.9.2'
          cp2=configparser.ConfigParser(interpolation=None)
          cp2.read_string(rootdesc)
          assert cp2.get('nemesis','type')=='install'
          inner=io.BytesIO()
          with zipfile.ZipFile(inner,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',desc)
              z.writestr('app/Gen5W-Climate-Mini-v0.9.apk',apk)
          target=Path('Gen5W-Climate-Mini-v0.9.2-NEMESIS-USB.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data',rootdesc)
              z.writestr('packages/gen5w.climate.mini.zip',inner.getvalue())
              z.writestr('README-USB.txt','Unzip once. Copy NEMESIS.data + packages/ to USB root.\n'
                  'v0.9.2 fixes V039 MAP hidden by NaviApp detection; NAV search requires OEM map-state or accessibility data.\n'
                  'Please test MAP and NAV screen switching while parked.\n')
          with zipfile.ZipFile(target) as z:
              c=configparser.ConfigParser(interpolation=None)
              c.read_string(z.read('NEMESIS.data').decode())
              assert c.get('nemesis','path') == 'packages/gen5w.climate.mini.zip'
              with zipfile.ZipFile(io.BytesIO(z.read(c.get('nemesis','path')))) as pkg:
                  c=configparser.ConfigParser(interpolation=None)
                  c.read_string(pkg.read('NEMESIS.data').decode())
                  assert c.get('nemesis','id') == 'gen5w.climate.mini'
                  assert c.get('app.0','path') in pkg.namelist()
                  assert pkg.read(c.get('app.0','path'))==apk
          print('Valid NEMESIS ZIP:',target,'APK SHA256',hashlib.sha256(apk).hexdigest())
          PYCODE
      - name: Upload v0.9 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.9.2-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.9.2-NEMESIS-USB.zip
      - name: Publish v0.9 to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.2'
          FILE='Gen5W-Climate-Mini-v0.9.2-NEMESIS-USB.zip'
          cat > /tmp/notes.md <<'NOTES'
          Gen5W Climate Mini v0.9.2 — Korean V039 MAP visibility fix.
          - V039 may report NaviApp while the MAP screen is in front. Restore NaviApp as a map candidate.
          - Optional read-only MNSoft getNaviMapViewState() binder detects when the map view is not showing.
          - Accessibility menu detection remains optional. If both OEM signals are unavailable, NAV search menu may still display the bar.
          - Climate Mini screen always keeps its bar. Other apps (stock Climate, media, settings) hide it.
          - Heat orange ON, controls, input responsiveness, saved position and audio from 0.9.1 are unchanged.
          - Test MAP and NAV while safely parked. Different V039 firmware may not expose the stock binder.
                    NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --title 'Gen5W Climate Mini v0.9.2' --notes-file /tmp/notes.md
          fi
