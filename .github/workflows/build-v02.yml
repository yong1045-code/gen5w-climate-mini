name: Build Gen5W Climate Mini v0.2

# This one-file build recipe applies the v0.2 files only in the CI workspace.
# The repo's existing app sources remain untouched until uploaded separately.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing Gen5W Climate Mini repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

