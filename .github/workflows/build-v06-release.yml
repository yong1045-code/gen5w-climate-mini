      - name: Verify climate app icon is available
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/ic_climate_mini.png
          python3 - <<'PYICON'
          from pathlib import Path
          p = Path('app/src/main/res/drawable-nodpi/ic_climate_mini.png')
          assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Verified launcher icon:', p, p.stat().st_size, 'bytes')
          PYICON
      - name: Compile Android 4.4-compatible APK
        shell: bash
        run: gradle --no-daemon assembleDebug
      - name: Make NEMESIS USB install archive
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile, hashlib
          apk = Path('app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          if len(apk) < 1000 or not zipfile.is_zipfile(Path('app/build/outputs/apk/debug/app-debug.apk')):
              raise RuntimeError('APK did not build correctly')
          descriptor = ("[nemesis]\n"
              "version=1.1\n"
              "id=gen5w.climate.mini\n"
              "name=Gen5W Climate Mini\n"
              "type=application\n"
              "package-version=0.6.0\n"
              "short-desc=Soft touch click, compact controls, read-only HEAT signal observer\n"
              "detailed-desc=Tap feedback and vehicle DATC. HEAT state read uses an unverified V039 MICOM signal; unknown remains ?. MAP inner screens may share Activity.\n"
              "os=any\nmodels=any\n\n"
              "[app.0]\n"
              "kind=apk\n"
              "path=app/Gen5W-Climate-Mini-v0.6.apk\n"
              "package=io.github.gen5w.climatemini\n"
              "component=io.github.gen5w.climatemini/io.github.gen5w.climatemini.MainActivity\n")
          package = Path('gen5w.climate.mini.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data', descriptor)
              z.writestr('app/Gen5W-Climate-Mini-v0.6.apk', apk)
          install_config = '[nemesis]\nversion=1.0\ntype=install\npath=packages/gen5w.climate.mini.zip\n'
          with zipfile.ZipFile('Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('NEMESIS.data', install_config)
              z.write(package, 'packages/gen5w.climate.mini.zip')
              z.writestr('README-USB.txt','Extract the archive to the USB root so NEMESIS.data and packages/ are at root.\n'
                  'Test the touch click, HEAT readback and MAP Activity filter parked. MAP search inside the same Activity may remain visible.\n')
          print('APK SHA256:', hashlib.sha256(apk).hexdigest())
          print('NEMESIS installer ZIP bytes:', Path('Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip').stat().st_size)
          PYCODE
      - name: Upload NEMESIS USB installer
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.6-NEMESIS-USB
          path: Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip
          if-no-files-found: error
      - name: Upload debug APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Gen5W-ClimateMini-v0.6-APK-for-debugging-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify final NEMESIS USB package
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          p = Path('Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip')
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert 'NEMESIS.data' in names and 'packages/gen5w.climate.mini.zip' in names, names
              with zipfile.ZipFile(__import__('io').BytesIO(z.read('packages/gen5w.climate.mini.zip'))) as inner:
                  assert 'NEMESIS.data' in inner.namelist()
                  assert 'app/Gen5W-Climate-Mini-v0.6.apk' in inner.namelist()
          print('Verified: USB installer contains nested NEMESIS descriptor and v0.6 APK')
          PYCODE
      - name: Publish direct-download GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v0.6.0'
          FILE='Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip'
          cat > /tmp/release-notes.md <<'NOTES'
          Gen5W Climate Mini v0.6 — NEMESIS USB installation package.

          - Short 55 ms low-volume touch feedback on accepted DRIVER/A/C/HEAT/SYNC taps (media volume dependent).
          - Main screen simplified to open/close only; scrollable status area on short screens.
          - Optional read-only DATC_HeatDisp (C2/C333) listener: V039 signal mapping NOT YET CONFIRMED.
          - When no trustworthy HEAT state is available, display ? (never a fabricated ON/OFF); one-tap requests can still alternate and may be out of sync with the stock HEAT button.
          - Map-only visibility still uses the foreground Activity. MAP search sharing the same Activity MAY NOT HIDE.
          - Reboot reopens the bar at the stored position when the user left it running.
          - Test all new behavior while safely parked before relying on it.

          INSTALL:
          Download **Gen5W-Climate-Mini-v0.6-NEMESIS-USB.zip** from the Assets list.
          Extract this zip once, then copy its NEMESIS.data and packages/ folder to the root of a USB drive.
          Keep v0.5 until the v0.6 package is ready. Follow NEMESIS update prompts; same app package data may be reset if its APK signature differs.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Gen5W Climate Mini v0.6' \
              --notes-file /tmp/release-notes.md
          fi
          echo 'Direct installer: https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/'"$FILE"
